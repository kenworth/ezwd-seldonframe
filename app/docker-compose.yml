    - caddy_0.try_files={path} /index.html /index.php
    - caddy_0=https://ai.ezwderp.com
    - caddy_ingress_network=fubbrjt4nkczuv0wjcyitkan
    networks:
      fubbrjt4nkczuv0wjcyitkan: null
    env_file:
